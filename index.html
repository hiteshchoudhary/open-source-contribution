<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hero Page</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #ffe29f 50%, #6a11cb 100%);
        }
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(120deg, #6a11cb 0%, #2575fc 60%, #43e97b 100%);
            color: #fff;
            text-align: center;
            box-shadow: 0 0 60px 0 rgba(67, 233, 123, 0.2), 0 0 120px 0 rgba(106, 17, 203, 0.15);
        }
        .hero-title {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #ff512f 0%, #dd2476 50%, #2575fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-subtitle {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0.95;
            color: #ffe29f;
            text-shadow: 1px 1px 8px #2575fc, 0 0 4px #ff512f;
        }
        .hero-btn {
            padding: 1rem 2rem;
            font-size: 1.1rem;
            background: linear-gradient(90deg, #43e97b 0%, #38f9d7 100%);
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 20px 0 rgba(67, 233, 123, 0.2);
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
        }
        .hero-btn:hover {
            background: linear-gradient(90deg, #ff512f 0%, #dd2476 100%);
            color: #fff;
            border: 2px solid #fff;
            box-shadow: 0 6px 30px 0 rgba(221, 36, 118, 0.3);
        }
        @media (max-width: 600px) {
            .hero-title {
                font-size: 2rem;
            }
            .hero-subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <h1 class="hero-title">Welcome to Your Hero Page</h1>
        <p class="hero-subtitle">Build something amazing. Start your journey here.</p>
        <button class="hero-btn">Get Started</button>
    </section>
</body>
</html>
