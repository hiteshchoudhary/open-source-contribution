<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hero Page</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f5f7fa;
        }
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(120deg, #6a11cb 0%, #2575fc 100%);
            color: #fff;
            text-align: center;
        }
        .hero-title {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        .hero-subtitle {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .hero-btn {
            padding: 1rem 2rem;
            font-size: 1.1rem;
            background: #fff;
            color: #2575fc;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, color 0.2s;
        }
        .hero-btn:hover {
            background: #2575fc;
            color: #fff;
            border: 2px solid #fff;
        }
        @media (max-width: 600px) {
            .hero-title {
                font-size: 2rem;
            }
            .hero-subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <h1 class="hero-title">Welcome to Your Hero Page</h1>
        <p class="hero-subtitle">Build something amazing. Start your journey here.</p>
        <button class="hero-btn">Get Started</button>
    </section>
</body>
</html>
